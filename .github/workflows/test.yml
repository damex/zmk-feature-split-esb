---
name: test
"on":
  workflow_call:
    inputs:
      target:
        type: string
        required: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      ZMK_REF: 753d8b467125fe860eec05ee71cb7ebefa08fba6
      ZMK_APP: ${{ github.workspace }}/zmk/app
      ZEPHYR_BASE: ${{ github.workspace }}/zmk/zephyr
    steps:
      - uses: actions/checkout@v4
        with:
          path: zmk-feature-split-esb
      - uses: actions/checkout@v4
        with:
          repository: zmkfirmware/zmk
          ref: ${{ env.ZMK_REF }}
          path: zmk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zmk/app/west.yml
      - uses: actions/cache@v4
        with:
          path: zmk/zephyr
          key: zephyr-${{ runner.os }}-${{ env.ZMK_REF }}
          restore-keys: zephyr-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: zmk/modules/lib/gui/lvgl
          key: lvgl-${{ runner.os }}-${{ env.ZMK_REF }}
          restore-keys: lvgl-${{ runner.os }}-
      - run: pip install west
      - run: west init -l zmk/app
      - run: west update zephyr lvgl
        working-directory: zmk
      - run: pip install -r zmk/zephyr/scripts/requirements-base.txt -r zmk/zephyr/scripts/requirements-build-test.txt -r zmk/zephyr/scripts/requirements-run-test.txt
      - run: make ${{ inputs.target }}
        working-directory: zmk-feature-split-esb
